# agent-sandbox-provision — user-editable configuration.
# This file is read by lockdown.py and the sub-commands. It is NOT generated;
# the user edits it directly. Defaults below are the v1 spec.

# ---- Lockdown roots ----
# Directories the lockdown sweep walks. v1 ships with $HOME only — everything
# else on macOS is already protected by default POSIX (other users' homes are 700,
# system dirs aren't writable by users).
lockdown_roots:
  - "$HOME"

# ---- Tier 1: deterministic chmod 600, no LLM call ----
# Filename glob patterns where false-positive rate is ~0.
tier_1_patterns:
  # SSH keys
  - "id_rsa"
  - "id_rsa.pub"
  - "id_ed25519"
  - "id_ed25519.pub"
  - "id_ecdsa"
  - "id_ecdsa.pub"
  - "id_dsa"
  - "id_dsa.pub"
  # PKI material
  - "*.pem"
  - "*.p12"
  - "*.pfx"
  - "*.jks"
  - "*.keystore"
  # Env files
  - ".env"
  - ".env.*"
  - ".envrc"
  - ".netrc"
  - "_netrc"
  # Service-account / OAuth credentials
  - "credentials.json"
  - "client_secret*.json"
  - "token.pickle"
  - "*service-account*.json"
  - "*-sa.json"
  # Password databases
  - "*.kdbx"
  - "*.agilekeychain"
  - "*.opvault"

# ---- Tier 2: batched Haiku call, gated by path prefilter ----
# Candidate must match BOTH a name pattern AND a path prefix below.
tier_2_path_prefixes:
  - "$HOME/.config"
  - "$HOME/.local"
  - "$HOME/Library/Application Support"
  # Project roots: any dir containing one of these markers.
  # Detected dynamically by walking up from each candidate. (Not a glob.)
  - "<project_root_marker>"
  # Top of $HOME (dotfiles).
  - "$HOME/.*"

tier_2_project_root_markers:
  - ".git"
  - "package.json"
  - "pyproject.toml"
  - "Cargo.toml"
  - "go.mod"
  - "Gemfile"
  - "pom.xml"

tier_2_name_patterns:
  - "*secret*"
  - "*credential*"
  - "*token*"
  - "*password*"
  - "*encrypt*"
  # Narrowed *key* patterns (drops keymap.json, monkey.txt, etc.)
  - "*.key"
  - "*-key"
  - "*_key"
  - "key.*"
  - "keys.*"
  - "*-keys.*"
  - "*_keys.*"
  - "*.crt"

# ---- Tier 3: excluded subtrees, never scanned ----
tier_3_excludes:
  - "node_modules/"
  - ".git/"
  - "vendor/"
  - ".venv/"
  - "venv/"
  - "dist/"
  - "build/"
  - "target/"
  - ".next/"
  - ".nuxt/"
  - ".turbo/"
  - "__pycache__/"
  - ".pytest_cache/"
  - ".tox/"
  - ".mypy_cache/"
  - "DerivedData/"

# ---- Classifier batching ----
# The classifier sends filename + absolute path only. No content previews.
# See SKILL.md "Privacy disclosure" and "Filename-only scope" for rationale.
classifier_batch_size: 8

# ---- AWS provider defaults ----
aws:
  ro_role_max_session_duration: 43200   # seconds; matches launcher's --duration-seconds
  managed_policy_arn: "arn:aws:iam::aws:policy/ReadOnlyAccess"
  guardrails_inline_policy_name: "claude-ro-guardrails"

# ---- GitHub provider defaults ----
github:
  # Seconds git's credential-cache reuses a minted ~1h installation token before
  # the broker helper mints a fresh one. Keeps us under GitHub's installation-token
  # creation limits over multi-day sessions. Must stay < 3600 (token lifetime).
  token_cache_seconds: 3000

# ---- macOS user ----
macos_user:
  username: "claude-ro"
  full_name: "Claude RO"
  shell: "/bin/zsh"

# ---- Launchd schedule for daily lockdown ----
launchd:
  hour: 3
  minute: 0
